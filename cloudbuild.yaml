# Cloud Build Configuration for Oracle Reel Agent
# Deploys to Cloud Run with CI/CD pipeline

steps:
  # Step 1: Run tests
  - name: 'python:3.11-slim'
    id: 'run-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        apt-get update && apt-get install -y --no-install-recommends \
          ffmpeg libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
          libffi-dev libxml2-dev libxslt-dev libssl-dev pkg-config build-essential \
          && rm -rf /var/lib/apt/lists/*
        pip install --no-cache-dir -r requirements.txt
        python -m pytest tests/ -v --tb=short || echo "No tests directory, skipping"

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'

  # Step 3: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
    waitFor: ['build-image']

  # Step 4: Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
    waitFor: ['build-image']

  # Step 5: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'deploy-cloudrun'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '${_MEMORY}'
      - '--cpu'
      - '${_CPU}'
      - '--min-instances'
      - '${_MIN_INSTANCES}'
      - '--max-instances'
      - '${_MAX_INSTANCES}'
      - '--timeout'
      - '${_TIMEOUT}'
      - '--concurrency'
      - '${_CONCURRENCY}'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_REGION=${_REGION},LOG_LEVEL=INFO'
      - '--set-secrets'
      - 'SARVAM_API_KEY=projects/${PROJECT_ID}/secrets/sarvam-api-key:latest,YOUTUBE_CREDENTIALS_FILE=projects/${PROJECT_ID}/secrets/youtube-credentials:latest,YOUTUBE_TOKEN_FILE=projects/${PROJECT_ID}/secrets/youtube-token:latest'
      - '--service-account'
      - '${_SERVICE_ACCOUNT}'
    waitFor: ['push-image']

  # Step 6: Verify deployment
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'verify-deployment'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
        echo "Service URL: $URL"
        echo "Waiting for service to be ready..."
        sleep 10
        for i in {1..10}; do
          if curl -f -s "$URL/health" > /dev/null; then
            echo "Health check passed!"
            curl -s "$URL/health" | jq .
            exit 0
          fi
          echo "Attempt $i/10 failed, retrying in 5s..."
          sleep 5
        done
        echo "Health check failed after 10 attempts"
        exit 1
    waitFor: ['deploy-cloudrun']

# Images to push to Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  substitutionOption: 'ALLOW_LOOSE'

# Substitutions (can be overridden at build time)
substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'oracle-reel-agent'
  _SERVICE_NAME: 'oracle-reel-agent'
  _MEMORY: '2Gi'
  _CPU: '2'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '10'
  _TIMEOUT: '3600'
  _CONCURRENCY: '80'
  _SERVICE_ACCOUNT: 'oracle-reel-agent@${PROJECT_ID}.iam.gserviceaccount.com'

# Tags for build history
tags:
  - 'oracle-reel-agent'
  - 'cloud-run'
  - 'adk'

# Timeout for entire build
timeout: '3600s'