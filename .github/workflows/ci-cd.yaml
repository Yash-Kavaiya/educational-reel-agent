name: Oracle Reel Agent - CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'oracle-reel-agent-cloudrun/**'
  pull_request:
    branches:
      - main
    paths:
      - 'oracle-reel-agent-cloudrun/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: 'us-central1'
  REPOSITORY: 'oracle-reel-agent'
  SERVICE_NAME: 'oracle-reel-agent'
  SERVICE_ACCOUNT: 'oracle-reel-agent@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com'

permissions:
  contents: 'read'
  id-token: 'write'
  packages: 'write'

jobs:
  # =============================================================================
  # Test Job
  # =============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    defaults:
      run:
        working-directory: oracle-reel-agent-cloudrun
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'oracle-reel-agent-cloudrun/requirements.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libffi-dev \
            libxml2-dev \
            libxslt-dev \
            libssl-dev \
            pkg-config \
            build-essential

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest pytest-asyncio pytest-cov

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short --cov=agent --cov-report=xml || echo "No tests directory, creating basic test"
          # Create basic test if none exists
          if [ ! -d "tests" ]; then
            mkdir -p tests
            cat > tests/test_basic.py << 'EOF'
            import sys
            sys.path.insert(0, '.')
            
            def test_imports():
                from agent.tools.reel_tools import (
                    create_storyboard,
                    render_reel,
                    batch_render_reels,
                    generate_social_copy,
                    ORACLE_PALETTE,
                    SARVAM_VOICES,
                )
                assert ORACLE_PALETTE['accent'] == '#E01C24'
                assert 'anushka' in SARVAM_VOICES
            
            def test_storyboard_creation():
                from agent.tools.reel_tools import create_storyboard
                result = create_storyboard(
                    topic="Test Topic",
                    content="Test content for storyboard generation",
                    reel_number=1,
                    total_reels=1,
                    voice="anushka",
                    series_title="Test Series"
                )
                assert result['status'] == 'success'
                assert 'storyboard_path' in result
            
            if __name__ == '__main__':
                test_imports()
                test_storyboard_creation()
                print("All basic tests passed!")
            EOF
            python -m pytest tests/test_basic.py -v

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: oracle-reel-agent

  # =============================================================================
  # Security Scan Job
  # =============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle-reel-agent-cloudrun
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Hadolint on Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  # =============================================================================
  # Build & Push to Artifact Registry
  # =============================================================================
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: oracle-reel-agent-cloudrun
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: 'access_token'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: 'gke-gcloud-auth-plugin'

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            BUILD_SHA=${{ github.sha }}

      - name: Verify image pushed
        run: |
          gcloud artifacts docker images list ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }} \
            --format='table[no-heading](tags,digest)' \
            --filter="tags:${{ github.sha }}"

  # =============================================================================
  # Deploy to Cloud Run (Staging)
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment: staging
    defaults:
      run:
        working-directory: oracle-reel-agent-cloudrun
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: 'access_token'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: 'gke-gcloud-auth-plugin'

      - name: Deploy to Cloud Run (Staging)
        id: deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }}-staging \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=2 \
            --min-instances=0 \
            --max-instances=5 \
            --timeout=3600 \
            --concurrency=80 \
            --set-env-vars=GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},GOOGLE_CLOUD_REGION=${{ env.REGION }},LOG_LEVEL=DEBUG \
            --set-secrets=SARVAM_API_KEY=projects/${{ env.PROJECT_ID }}/secrets/sarvam-api-key:latest,YOUTUBE_CREDENTIALS_FILE=projects/${{ env.PROJECT_ID }}/secrets/youtube-credentials:latest,YOUTUBE_TOKEN_FILE=projects/${{ env.PROJECT_ID }}/secrets/youtube-token:latest \
            --service-account=${{ env.SERVICE_ACCOUNT }} \
            --labels=environment=staging,version=${{ github.sha }}

      - name: Verify Staging Deployment
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }}-staging --region=${{ env.REGION }} --format='value(status.url)')
          echo "Staging URL: $URL"
          echo "STAGING_URL=$URL" >> $GITHUB_OUTPUT
          
          echo "Waiting for service to be ready..."
          sleep 15
          for i in {1..10}; do
            if curl -f -s "$URL/health" > /dev/null; then
              echo "Staging health check passed!"
              curl -s "$URL/health" | jq .
              break
            fi
            echo "Attempt $i/10 failed, retrying in 5s..."
            sleep 5
          done

  # =============================================================================
  # Deploy to Cloud Run (Production)
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment: production
    defaults:
      run:
        working-directory: oracle-reel-agent-cloudrun
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: 'access_token'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: 'gke-gcloud-auth-plugin'

      - name: Deploy to Cloud Run (Production)
        id: deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=2 \
            --min-instances=1 \
            --max-instances=10 \
            --timeout=3600 \
            --concurrency=80 \
            --set-env-vars=GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},GOOGLE_CLOUD_REGION=${{ env.REGION }},LOG_LEVEL=INFO \
            --set-secrets=SARVAM_API_KEY=projects/${{ env.PROJECT_ID }}/secrets/sarvam-api-key:latest,YOUTUBE_CREDENTIALS_FILE=projects/${{ env.PROJECT_ID }}/secrets/youtube-credentials:latest,YOUTUBE_TOKEN_FILE=projects/${{ env.PROJECT_ID }}/secrets/youtube-token:latest \
            --service-account=${{ env.SERVICE_ACCOUNT }} \
            --labels=environment=production,version=${{ github.sha }}

      - name: Verify Production Deployment
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "Production URL: $URL"
          echo "PRODUCTION_URL=$URL" >> $GITHUB_OUTPUT
          
          echo "Waiting for service to be ready..."
          sleep 15
          for i in {1..10}; do
            if curl -f -s "$URL/health" > /dev/null; then
              echo "Production health check passed!"
              curl -s "$URL/health" | jq .
              break
            fi
            echo "Attempt $i/10 failed, retrying in 5s..."
            sleep 5
          done

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            oracle-reel-agent-cloudrun/Dockerfile
            oracle-reel-agent-cloudrun/requirements.txt
            oracle-reel-agent-cloudrun/cloudbuild.yaml

  # =============================================================================
  # Notify on Completion
  # =============================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Send notification
        run: |
          STATUS="${{ needs.deploy-staging.result }}/${{ needs.deploy-production.result }}"
          echo "Deployment completed with status: $STATUS"
          
          # Could integrate with Slack, Discord, Email, etc.
          # Example Slack webhook:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"Oracle Reel Agent deployment '"$STATUS"'"}' \
          #   ${{ secrets.SLACK_WEBHOOK }}